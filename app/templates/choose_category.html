{% extends "base.html" %}
{% block title %}Add Product{% endblock %}

{% block content %}
<h1 class="h3 mb-1">What are you adding?</h1>
<p class="text-muted mb-4">Each category resolves its own attribute set.</p>

<div class="list-group">
  {% for c in categories %}
    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
       href="/admin/products/new/{{ c.slug }}">
      {{ c.name }}
      <span class="text-muted small">/{{ c.slug }}</span>
    </a>
  {% endfor %}
</div>
{% endblock %}
